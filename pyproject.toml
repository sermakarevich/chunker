[project]
name = "chunker"
version = "0.1.0"
description = "Hierarchical document chunking with multi-level summaries for progressive disclosure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-ollama",
    "pydantic",
    "pymupdf>=1.27.2.3",
]

[project.scripts]
chunker = "chunker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chunker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
